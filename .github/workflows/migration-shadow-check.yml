name: Migration Shadow Check

# WHY THIS EXISTS (SWA-200, panel 2026-08-23)
# -------------------------------------------
# Ox Alpha, asked what nobody was proposing: "everyone is guarding the push; nobody is
# guarding the migration." render.yaml builds `main` with `npm run migrate:production`, so a
# push to main runs migrations against the production database, unsupervised.
#
# Every gate built before this one is CLIENT-SIDE — pre-commit and pre-push hooks, living in
# the same clients they police. GLM: "nothing distinguishes 'gate passed' from 'gate not
# installed'." Verified: a fresh clone has core.hooksPath unset and every hook silently skips.
# Kimi, on the local backend audit: "it's a deploy-safety gate wearing a commit-hygiene
# costume. It belongs at the deploy boundary, not the push boundary."
#
# This is that boundary. It runs on GitHub, from the pushed SHA, against a throwaway
# database. It cannot be skipped with --no-verify, cannot be missing because a checkout
# forgot to configure hooks, and — unlike every local gate — it tests THE ARTIFACT THAT
# ACTUALLY DEPLOYS rather than the state of somebody's laptop.
#
# Grok, on the local Rule 42 gate: it enforces "this laptop's backend/ is clean", not "the SHA
# Render will boot". This job checks the second one, which is the predicate that matches the
# 2026-04-12 crash-loop incident.
#
# NOT PRODUCTION. The `postgres` service below is an empty ephemeral container that lives and
# dies with the job. No production credential is used, and none should ever be added: the
# whole value is that this is the one place migrations can fail harmlessly.
#
# WHAT IT CANNOT DO — MEASURED, NOT ASSUMED (2026-09-24, run 36040881514 @ 948d73251).
# The premise of the migration step below — "run the chain against an empty database" — is
# FALSE for this repo, and this gate has therefore never once returned a valid verdict. On an
# empty Postgres 16 the runner connects, reports 378 pending / 0 already executed, and then
# fails the whole chain: 127 of the first 201 migrations quarantined, 0 applied, every error a
# missing relation (`Users`, `sessions`, `orientations`, `goals`, `orders`) that NO migration
# in this directory creates. The chain is a DELTA chain — production's base schema predates it
# — so it cannot bootstrap from empty at all. At the observed ~5.8s per migration it needs ~37
# minutes just to finish failing, which is why every previous red was read as "slow/flaky"
# rather than "structurally impossible".
#
# The migration step is therefore now a bounded, non-blocking SMOKE check: it still proves the
# runner starts, connects, and ledgers its failures, and it no longer burns the whole job
# window or paints a permanent red that trains reviewers to ignore red. The verdict that
# matters — "do THIS SHA's migrations apply against the REAL schema" — requires restoring a
# production snapshot into the shadow database first. That is Sean's decision on snapshot
# handling and is deliberately not assumed here (SWA-200). Until it lands, do NOT read this
# job as evidence about the deploy.

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/migrations/**'
      - 'backend/models/**'
      - 'backend/scripts/safe-migrate.mjs'
      - 'backend/scripts/pre-migrate-guard.mjs'
      - 'backend/package.json'
      - 'render.yaml'
      - '.github/workflows/migration-shadow-check.yml'
  push:
    branches: [main]
    paths:
      - 'backend/migrations/**'
      - 'backend/models/**'
      - 'backend/scripts/safe-migrate.mjs'
  workflow_dispatch:

concurrency:
  # One shadow run per ref. A superseded run tells you about a SHA nobody is deploying.
  group: migration-shadow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shadow-migrate:
    runs-on: ubuntu-latest
    name: Migrations run clean on a throwaway database
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shadow
          POSTGRES_PASSWORD: shadow
          POSTGRES_DB: shadow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U shadow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Local container only. Never a production credential — see the header.
      DATABASE_URL: postgres://shadow:shadow@localhost:5432/shadow
      NODE_ENV: production
      # This container has no TLS. Without the opt-out, the run dies at connect
      # time ("The server does not support SSL connections") before any migration
      # executes — so the gate reported red while never testing the thing it
      # exists for. Production keeps TLS required; see productionDialectOptions()
      # in backend/scripts/safe-migrate.mjs.
      PGSSLMODE: disable

    steps:
      - name: Check out the pushed SHA
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Deliberately `npm install`, not `npm ci` — it is what render.yaml:66 runs. A shadow
      # check that installs differently from the deploy is testing a different artifact.
      - name: Install backend dependencies exactly as the deploy does
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Report the pending migration set before running it
        working-directory: backend
        run: node scripts/pre-migrate-guard.mjs --check

      # SMOKE CHECK, NOT A VERDICT — read this before trusting it.
      #
      # MEASURED 2026-09-24 (run 36040881514 @ 948d73251, empty Postgres 16):
      # the runner connected and reported `Total migrations: 378 / Already
      # executed: 0 / Pending: 378`, then spent the entire job window failing
      # 127 of the first 201 and applying NONE. Every error was a missing
      # relation — `Users`, `sessions`, `orientations`, `goals`, `orders` —
      # tables that NO migration in this directory creates. The chain is a
      # DELTA chain: production's base schema predates it (built by an earlier
      # era of the project), so it cannot bootstrap from empty at all. At the
      # observed ~5.8s per migration it needs ~37 minutes just to finish failing.
      #
      # Consequence: this step can never return a green verdict, and it never
      # has. Every red it has ever shown was either the TLS failure (before
      # PGSSLMODE existed) or this. It is kept — bounded and non-blocking —
      # because it still proves three cheap, real things: the runner starts, it
      # connects, and the quarantine ledger records what failed.
      #
      # The verdict that actually matters — "do THIS SHA's migrations apply
      # against the real schema" — needs a production snapshot restored into the
      # shadow database first. That is Sean's call on snapshot handling and is
      # deliberately not assumed here (SWA-200). Until it lands, do NOT read
      # this step as evidence about the deploy.
      - name: Run migrations against the shadow database (smoke — see note above)
        id: shadow_run
        working-directory: backend
        continue-on-error: true
        timeout-minutes: 12
        run: npm run migrate:production

      - name: Run them AGAIN — migrations must be idempotent
        # Only meaningful once a first pass actually applied something. While the
        # empty-DB premise holds, a second identical failure proves nothing and
        # costs another 12 minutes, so it is skipped rather than run.
        # Render can rebuild the same SHA (manual redeploy, cache miss, a
        # restart). A migration set that only survives one application is a
        # latent outage waiting for the next redeploy, and nothing else in the
        # system checks this.
        if: steps.shadow_run.outcome == 'success'
        working-directory: backend
        run: npm run migrate:production

      # The failure this whole layer exists for is a boot crash: ERR_MODULE_NOT_FOUND from an
      # untracked file, or a missing-export SyntaxError from an uncommitted one. Rule 42's
      # local gate infers that from the pusher's working tree. This imports the entry point
      # from the pushed SHA and finds out.
      - name: Prove the backend entry point actually loads from this SHA
        working-directory: backend
        run: |
          ENTRY=$(node -p "require('./package.json').main || 'server.mjs'")
          echo "entry point: $ENTRY"
          node --input-type=module -e "
            const t = setTimeout(() => { console.log('loaded; exiting before the server settles'); process.exit(0); }, 20000);
            try {
              await import('./' + process.env.ENTRY);
              clearTimeout(t);
              console.log('entry point imported without throwing');
              process.exit(0);
            } catch (e) {
              clearTimeout(t);
              console.error('ENTRY POINT FAILED TO LOAD — this SHA would crash-loop on Render:');
              console.error(e && e.stack || e);
              process.exit(1);
            }
          "
        env:
          ENTRY: server.mjs

      - name: Summary
        if: always()
        run: |
          echo "### Migration shadow check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Imported the backend entry point from the pushed SHA to prove it loads." >> $GITHUB_STEP_SUMMARY
          echo "The migration run above is a bounded SMOKE check, NOT a verdict: this repo's" >> $GITHUB_STEP_SUMMARY
          echo "migration chain is a delta chain whose base schema predates it, so it cannot" >> $GITHUB_STEP_SUMMARY
          echo "bootstrap from an empty database. Measured 2026-09-24: 378 pending, 0 applied," >> $GITHUB_STEP_SUMMARY
          echo "127 of the first 201 quarantined, every error a missing relation." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This tests the artifact that deploys — not the state of anyone's working tree," >> $GITHUB_STEP_SUMMARY
          echo "and it cannot be skipped with \`--no-verify\` or by a checkout that never" >> $GITHUB_STEP_SUMMARY
          echo "configured \`core.hooksPath\`." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Limit:** an empty database is not production — and here it is not even" >> $GITHUB_STEP_SUMMARY
          echo "runnable. Restoring a production snapshot into the shadow database is what would" >> $GITHUB_STEP_SUMMARY
          echo "make this a real gate; see SWA-200. Until then, do not read this job as evidence" >> $GITHUB_STEP_SUMMARY
          echo "about the deploy." >> $GITHUB_STEP_SUMMARY
