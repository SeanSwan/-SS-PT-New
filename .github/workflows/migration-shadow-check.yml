name: Migration Shadow Check

# WHY THIS EXISTS (SWA-200, panel 2026-08-23)
# -------------------------------------------
# Ox Alpha, asked what nobody was proposing: "everyone is guarding the push; nobody is
# guarding the migration." render.yaml:20 builds `main` with `npm run migrate:production`, so
# a push to main runs migrations against the production database, unsupervised.
#
# Every gate built before this one is CLIENT-SIDE — pre-commit and pre-push hooks, living in
# the same clients they police. GLM: "nothing distinguishes 'gate passed' from 'gate not
# installed'." This runs on GitHub, against a throwaway database, and cannot be skipped with
# --no-verify or be missing because a checkout forgot to configure hooks.
#
# NOT PRODUCTION. The `postgres` service below is an empty ephemeral container that lives and
# dies with the job. No production credential is used, and none should ever be added.
#
# ---------------------------------------------------------------------------------------
# REBUILT 2026-08-24 after a three-seat hostile review (Claude / Ox Alpha / GLM 5.3) of the
# merged surface. The review found the previous version was VACUOUS — it could not fail:
#
#   1. `npm run migrate:production` exits 0 even when migrations genuinely fail.
#      safe-migrate.mjs marks a failed migration as applied and continues; that file contains
#      exactly two process.exit(1) calls and neither is reachable from `failed > 0`. Both
#      steps the old file labelled "THE ACTUAL GATE" were incapable of failing.
#      FIX: SWAN_MIGRATE_STRICT=1 (added to safe-migrate.mjs; production default unchanged).
#
#   2. The second migration leg ran ZERO migrations. Leg 1 applied all of them to an empty
#      database, so by the time the seeder inserted rows every migration was already recorded
#      in SequelizeMeta and leg 2 printed "No pending migrations" and returned. Nothing ever
#      migrated against populated tables — the entire purpose of seeding.
#      FIX: baseline-then-delta. Leg A applies the BASE commit's migration set to an empty
#      database; the seeder fills it; leg B then applies ONLY the migrations this change
#      adds, against POPULATED tables. That is the test the seeding layer was built for.
#
#   3. safe-migrate's "already applied" heuristic swallows `duplicate key value` and
#      `violates foreign key constraint` — precisely the errors a migration raises against
#      populated tables, i.e. the two classes the seeder exists to surface.
#      FIX: STRICT disables the heuristic. On a database created empty seconds ago, nothing
#      can legitimately already exist, so there every match hid a real defect.
#
#   4. The guard's `--check` step ran BEFORE any migration, against a fresh container where
#      "SequelizeMeta" never exists — so the step named "report the pending set" was
#      incapable of reporting anything, in any run, ever.
#      FIX: it now runs BETWEEN leg A and leg B, where the pending set is exactly the delta
#      about to meet real data. That is the one place the step is meaningful.
#
# What this still does not prove is stated in the Summary step, not hidden.

on:
  pull_request:
    branches: [main]
    # NO `paths:` FILTER HERE, DELIBERATELY — and do not add one back.
    #
    # GLM 5.3, round 2: this check is only a real gate when it is a REQUIRED status check on
    # PRs to main (on a direct push, Render deploys in parallel and Actions cannot block it).
    # A required check that a paths filter skips does not report success — it sits as
    # "Expected — Waiting for status report" and blocks the merge forever. The three
    # end-states were: not-required (advisory, bypassable), required-with-paths (every
    # unrelated PR hangs), required-without-paths. Only the third one works.
    #
    # The cost is a few minutes of runner time on PRs touching no migrations. That case is
    # already handled honestly: the delta step reports 0 and leg B prints NOT APPLICABLE
    # instead of implying a test happened. That branch exists for exactly this — round 2
    # pointed out that the previous comment here forbade the fix it was built for.
  push:
    branches: [main]
    # A filter IS kept on push, where the deadlock above cannot happen (nothing waits on a
    # push check) and an unfiltered run would burn minutes on every commit to main. The
    # previous version listed only four paths, so a push touching render.yaml, package.json,
    # the guard — or THIS FILE — ran no check, and the gate's own merge triggered nothing.
    #
    # DO NOT refactor into a YAML anchor: GitHub Actions does not support anchors/aliases in
    # workflow files. The alias would not resolve and the filter would silently stop matching.
    paths:
      - 'backend/migrations/**'
      - 'backend/models/**'
      - 'backend/config/**'
      - '.sequelizerc'
      - 'backend/scripts/safe-migrate.mjs'
      - 'backend/scripts/pre-migrate-guard.mjs'
      - 'backend/scripts/seed-shadow-db.mjs'
      - 'backend/scripts/seed-shadow-db.selftest.mjs'
      - 'backend/scripts/shadow-meta-count.mjs'
      - 'backend/scripts/shadow-delta-audit.mjs'
      - 'backend/scripts/shadow-table-extract.mjs'
      - 'backend/scripts/shadow-table-extract.selftest.mjs'
      - 'backend/package.json'
      - 'render.yaml'
      - '.github/workflows/migration-shadow-check.yml'
  workflow_dispatch:

concurrency:
  group: migration-shadow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shadow-migrate:
    runs-on: ubuntu-latest
    name: Migrations run clean on a throwaway database — baseline, then the delta against data
    # 307 migrations, each a separate `npx sequelize-cli` spawn inside safe-migrate.mjs, plus
    # an npm install and a 217-model seed. 20 minutes was optimistic to the point of being a
    # likely false red.
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shadow
          POSTGRES_PASSWORD: shadow
          POSTGRES_DB: shadow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U shadow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Local container only. Never a production credential. User, password and database name
      # are the SAME literal on purpose (panel item 4): a mismatch here once let an auth check
      # pass vacuously because the broken URL still parsed. The seeder's own safety gate keys
      # off this string — it refuses any URL that is not loopback AND does not contain
      # "shadow", with no override switch.
      DATABASE_URL: postgres://shadow:shadow@localhost:5432/shadow
      NODE_ENV: production
      # THE GATE'S ABILITY TO FAIL AT ALL. Without this, safe-migrate.mjs swallows every
      # migration failure and exits 0 — finding 1 in the header. Production leaves this unset
      # and keeps its deliberate recovery behaviour.
      SWAN_MIGRATE_STRICT: '1'

    steps:
      - name: Check out the pushed SHA (full history — the base diff needs it)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Deliberately `npm install`, not `npm ci` — it is what render.yaml:20 runs. A shadow
      # check that installs differently from the deploy is testing a different artifact.
      #
      # MEASURED, AND DELIBERATELY NOT FIXED HERE: NODE_ENV=production makes npm omit
      # devDependencies (`NODE_ENV=production npm config get omit` -> dev), and sequelize-cli
      # is a devDependency, so it is absent and `npx` fetches it from the registry at migrate
      # time. Production does exactly the same thing today — every Render deploy resolves an
      # unpinned sequelize-cli over the network. Fixing that means moving sequelize-cli into
      # `dependencies`, which changes the production install, so it is a separate ticket
      # rather than a drive-by here. This gate inherits that nondeterminism; it does not add
      # it.
      - name: Install backend dependencies exactly as the deploy does
        working-directory: backend
        run: npm install --no-audit --no-fund

      # A broken generator contract fails here — cheaply, with full output — instead of
      # surfacing later as a silently empty database.
      - name: DB-free contract self-tests (seeder + table extractor)
        working-directory: backend
        run: |
          set -euo pipefail
          node scripts/seed-shadow-db.selftest.mjs
          # The extractor decides whether an added migration's target table was seeded. Its
          # load-bearing contract is that an unreadable migration returns UNKNOWN, never "no
          # tables" — if that ever regresses, the audit downstream starts printing OK for files
          # nothing has read, which is precisely the vacuous-green defect this gate exists for.
          node scripts/shadow-table-extract.selftest.mjs

      # -----------------------------------------------------------------------------------
      # Resolve what this change actually adds. Everything below depends on this split:
      # baseline first, seed, THEN the delta against data.
      # -----------------------------------------------------------------------------------
      - name: Resolve the base commit and the migration delta
        id: delta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          ZERO=0000000000000000000000000000000000000000
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_BASE_SHA" ]; then
            BASE="$PR_BASE_SHA"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "$ZERO" ]; then
            BASE="$PUSH_BEFORE"
          else
            BASE="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "FATAL: base commit $BASE is not present in this checkout."
            echo "fetch-depth: 0 is required for the baseline-then-delta split."
            exit 1
          fi
          # Classify the delta instead of counting changed paths.
          #
          # GLM 5.3 R3-F1 / Ox Alpha R3-F3 (found independently): the old form counted CHANGED
          # PATHS via --name-only, while the gate downstream counted EXECUTED NEW NAMES. Those
          # are different sets, and comparing them was wrong in BOTH directions — a PR that
          # added one migration and modified another passed green with the modification
          # executed nowhere, and a deletion-only PR FATAL-ed on a legitimate change.
          #
          # Also note the previous line ended in `|| true`, which turned a failed git diff into
          # count=0 and then into a green NOT-APPLICABLE run that had computed nothing
          # (R3-F4) — the masked-failure family already fixed twice elsewhere in this file.
          # The helper exits nonzero instead.
          cd backend
          node scripts/shadow-delta-audit.mjs --base "$BASE" --mode classify | tee ../delta.txt
          cd ..
          ADDED=$(grep -oE '^added_count=[0-9]+' delta.txt | head -1 | cut -d= -f2)
          ADDED=${ADDED:-0}
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "added=$ADDED" >> "$GITHUB_OUTPUT"
          echo "base commit: $BASE"
          echo "migrations ADDED by this change (the only ones leg B can execute): $ADDED"

      # LEG A — the baseline. This is the schema the delta will actually meet in production.
      - name: Leg A — apply the BASE migration set to an empty database
        id: lega
        shell: bash
        env:
          BASE: ${{ steps.delta.outputs.base }}
        run: |
          set -euo pipefail
          # Models AND migrations, together. The seeder derives its rows from the MODEL
          # definitions, so leaving models at HEAD while migrations sit at BASE would have the
          # seeder try to insert into tables that this change's not-yet-applied migrations
          # create — a red job caused by the split itself rather than by any real defect.
          # Baseline means baseline on both sides of that pair.
          rm -rf backend/migrations backend/models
          git checkout "$BASE" -- backend/migrations backend/models
          # Count EXACTLY what safe-migrate.mjs counts. getAllMigrationFiles() filters to
          # .cjs/.js (safe-migrate.mjs:145-149); a bare `ls` also counts the 36 .mjs files in
          # this directory that the runner silently ignores. Measured on the current tree:
          # ls = 343, .cjs/.js = 307. Asserting against 343 would have FATAL-ed every single
          # run — a guaranteed false red introduced by the very fix that was supposed to
          # replace an echo with an assertion. Caught by attacking my own patch, not by review.
          #
          # (Those 36 .mjs files are a separate finding: they look like migrations and never
          # execute. Flagged on SWA-200, not touched here.)
          BASE_COUNT=$(find backend/migrations -maxdepth 1 -type f \( -name '*.cjs' -o -name '*.js' \) | wc -l | tr -d ' ')
          echo "base_count=$BASE_COUNT" >> "$GITHUB_OUTPUT"
          echo "baseline migration files (.cjs/.js, as safe-migrate counts them): $BASE_COUNT"
          cd backend
          npm run migrate:production

      # Streams are captured SEPARATELY and concatenated after. Two reasons: `2>&1` into one
      # file can interleave mid-line and break the anchored grep below, and — the defect the
      # review found — under GitHub's default `bash -e` shell a non-zero seeder exit aborted
      # the step at the node line, so `status=$?`, the concat and `exit $status` were all
      # unreachable, and stderr was discarded exactly when it was needed. `|| status=$?`
      # captures the failure without tripping -e.
      - name: Seed synthetic rows (shadow-only by internal gate)
        working-directory: backend
        shell: bash
        run: |
          set -uo pipefail
          status=0
          node scripts/seed-shadow-db.mjs --rows 5 > seed-shadow.log 2> seed-shadow.err || status=$?
          echo "--- seeder stderr ---"
          cat seed-shadow.err || true
          cat seed-shadow.err >> seed-shadow.log || true
          exit $status

      - name: Assert seed actually inserted rows (SHADOW-SEED rows > 0)
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f seed-shadow.log ]; then
            echo "FATAL: seed-shadow.log is missing — the seed step did not run"
            exit 1
          fi
          # Anchor to the exact report shape "SHADOW-SEED {" — the bare prefix also matches
          # OK/SKIP/note lines, and the report is the only line carrying the JSON body.
          line=$(grep '^SHADOW-SEED {' seed-shadow.log | tail -1 || true)
          if [ -z "$line" ]; then
            echo "FATAL: no SHADOW-SEED report line found — silent no-op seed"
            cat seed-shadow.log
            exit 1
          fi
          echo "$line"
          rows=$(printf '%s' "$line" | sed -E 's/^SHADOW-SEED //' | node -e "let s='';process.stdin.on('data',function(d){s+=d;}).on('end',function(){var r=JSON.parse(s).rows;console.log(Number.isInteger(r)?r:'NaN');});")
          echo "rows inserted: $rows"
          # `[ "$x" -le 0 ]` on a non-integer prints "integer expression expected" and returns
          # false — and because a condition inside `if` is exempt from `set -e`, the FATAL
          # branch would be SKIPPED and the step would go GREEN. Validate the shape first.
          case "$rows" in
            ''|*[!0-9]*)
              echo "FATAL: seeder reported a non-integer row count ('$rows') — report shape drifted"
              exit 1
              ;;
          esac
          if [ "$rows" -le 0 ]; then
            echo "FATAL: seeder reported zero rows — the delta would be tested against nothing"
            exit 1
          fi

          # COVERAGE, not realism — the distinction GLM 5.3 drew in round 2.
          #
          # The assertion above is on the AGGREGATE total. A migration whose target table the
          # seeder SKIPPED still meets an EMPTY table in leg B, passes, and goes green — while
          # in production that table holds rows and the same migration fails. The Summary's
          # "synthetic rows are not production data" frames that as a realism limit. It is a
          # coverage limit, and unlike realism it can be made visible. Any table listed here
          # was NOT covered by leg B, however green this job looks.
          skipped=$(printf '%s' "$line" | sed -E 's/^SHADOW-SEED //' | node -e "let s='';process.stdin.on('data',function(d){s+=d;}).on('end',function(){var j=JSON.parse(s);console.log((j.skipped||[]).join('; ')||'(none)');});")
          echo "tables NOT populated — leg B cannot test these: $skipped"
          echo "SEED_SKIPPED<<EOF" >> "$GITHUB_ENV"
          echo "$skipped" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      # LEG B — THE REAL TEST, and the reason the seeder exists. These migrations have never
      # been applied, and they now meet POPULATED tables: a NOT NULL added to a filled column,
      # a unique index over existing rows, an FK that existing data violates. Under
      # SWAN_MIGRATE_STRICT=1 each of those fails the job instead of being marked applied.
      - name: Leg B — apply THIS change's migrations against the populated database
        shell: bash
        env:
          ADDED_COUNT: ${{ steps.delta.outputs.added }}
          BASE_COUNT: ${{ steps.lega.outputs.base_count }}
          BASE: ${{ steps.delta.outputs.base }}
        run: |
          set -euo pipefail
          # Restore this change's migrations AND models before the delta runs.
          rm -rf backend/migrations backend/models
          git checkout HEAD -- backend/migrations backend/models
          cd backend
          before=$(node scripts/shadow-meta-count.mjs)
          echo "SequelizeMeta rows before leg B: $before"

          # F7 (GLM 5.3 round 2): assert, do not merely echo. SequelizeMeta must hold exactly
          # the BASE file count here. If leg A finished without recording every migration, the
          # relative before/after gate below would be satisfied by BASE leftovers.
          # Validate the shape BEFORE comparing. `[ x -ne 3 ]` on a non-integer prints
          # "integer expression expected" and returns false, and a condition inside `if` is
          # exempt from `set -e` — so the FATAL branch would be SKIPPED and the step would go
          # green. That is the identical mechanism the row-count assertion was fixed for
          # earlier in this same file; I reintroduced it two steps later.
          case "$before$BASE_COUNT" in
            ''|*[!0-9]*)
              echo "FATAL: non-integer counts (before='$before' base='$BASE_COUNT')"
              exit 1
              ;;
          esac
          if [ "$before" -ne "$BASE_COUNT" ]; then
            echo "FATAL: SequelizeMeta holds $before rows but leg A applied $BASE_COUNT files."
            echo "Leg A did not record every migration; the delta assertion cannot be trusted."
            exit 1
          fi

          # THE GUARD RUNS HERE, AND ONLY HERE.
          #
          # GLM 5.3 round 2 caught round 1's defect surviving its own fix. The guard had been
          # moved "between the legs", but the migrations DIRECTORY was still at BASE there
          # (HEAD is checked out three lines above), so its pending set was
          # (BASE files) minus (BASE files) = EMPTY, in every run, forever. Round 1's version
          # was merely empty; the moved version was renamed "report the delta" and so printed
          # an authoritative "0 pending" next to a delta of N — actively misleading.
          #
          # This is the only state in the job where its arithmetic means anything:
          # directory = HEAD, SequelizeMeta = BASE, so pending == the delta about to meet data.
          node scripts/pre-migrate-guard.mjs --check

          npm run migrate:production
          after=$(node scripts/shadow-meta-count.mjs)
          echo "SequelizeMeta rows after  leg B: $after"
          applied=$(( after - before ))
          echo "migrations applied against populated data: $applied"

          # THE HONESTY GATE, rebuilt. It now compares like with like: every migration this
          # change ADDS must have executed here, against populated tables. Modified/deleted/
          # renamed files are reported as untestable rather than counted — a migration already
          # in SequelizeMeta never re-runs, here or on Render, so failing on them was a false
          # red and silently including them in an aggregate was a vacuous green.
          #
          # It also FATALs when an added migration targets a table the seeder could not
          # populate: leg B would have run it against an EMPTY table and proved nothing, while
          # production has rows. Round 2 only printed that fact into a summary no machine reads.
          # GLM 5.3: "visibility is not enforcement."
          node scripts/shadow-delta-audit.mjs \
            --base "$BASE" --mode verify \
            --applied "$applied" --skipped "${SEED_SKIPPED:-}"
          if [ "$ADDED_COUNT" -eq 0 ]; then
            echo "NOTE: this change adds no migrations, so leg B executed nothing."
            echo "The populated-schema test is NOT APPLICABLE here — it is not a pass."
          fi

      # What this proves: the module graph resolves from this SHA — ERR_MODULE_NOT_FOUND from
      # an untracked file, a missing export from an uncommitted one (the Rule 42 class).
      # What it does NOT prove: that the server boots. server.mjs does its work in an async
      # IIFE, so the import resolves before that IIFE finishes and this step exits first. The
      # step is named for what it actually does, not for what we wish it did.
      - name: Prove the backend module graph resolves from this SHA
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          ENTRY=$(node -p "require('./package.json').main || 'server.mjs'")
          echo "entry point: $ENTRY"
          # The previous version computed ENTRY here, printed it, then imported a HARDCODED
          # literal from an `env:` block — printing one thing while testing another.
          ENTRY="$ENTRY" node --input-type=module -e "
            const t = setTimeout(function () {
              console.error('ENTRY POINT DID NOT RESOLVE within 20s.');
              console.error('The import never settled — a top-level await on something');
              console.error('unreachable, or a module-scope hang. Previously this exited 0,');
              console.error('so a hung import was reported as a PASS.');
              process.exit(1);
            }, 20000);
            try {
              await import('./' + process.env.ENTRY);
              clearTimeout(t);
              console.log('module graph resolved without throwing');
              process.exit(0);
            } catch (e) {
              clearTimeout(t);
              console.error('ENTRY POINT FAILED TO LOAD — this SHA would crash-loop on Render:');
              console.error((e && e.stack) || e);
              process.exit(1);
            }
          "

      - name: Upload seed report and stderr
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seed-shadow-log
          path: |
            backend/seed-shadow.log
            backend/seed-shadow.err
          if-no-files-found: ignore

      - name: Summary
        if: always()
        shell: bash
        env:
          BASE: ${{ steps.delta.outputs.base }}
          ADDED_COUNT: ${{ steps.delta.outputs.added }}
        run: |
          {
            echo "### Migration shadow check"
            echo ""
            echo "Base commit: \`$BASE\`"
            echo "Migrations **added** by this change (the only ones leg B can execute): **$ADDED_COUNT**"
            echo ""
            echo "1. Applied the BASE migration set to an empty throwaway Postgres."
            echo "2. Seeded deterministic synthetic rows (zero PII)."
            echo "3. Applied **this change's** migrations against those populated tables."
            echo "4. Resolved the backend module graph from this SHA."
            echo ""
            echo "Migration failures fail this job (\`SWAN_MIGRATE_STRICT=1\`). Production keeps"
            echo "its recovery behaviour, which exits 0 on failure by design."
            echo ""
            echo "Tables the seeder could not populate (leg B did **not** test these):"
            echo ""
            echo "\`${SEED_SKIPPED:-unknown}\`"
            echo ""
            echo "**What this does NOT prove:**"
            echo "- Synthetic rows are not production data. A snapshot-restore gate is the stronger form."
            echo "- The module graph resolving is not the server booting."
            echo "- On a direct push to \`main\`, Render deploys in PARALLEL with this job — Actions"
            echo "  cannot block it. This only gates when it is a REQUIRED status check on PRs."
            echo "- A migration already recorded in SequelizeMeta never re-runs. Edits and deletions"
            echo "  to existing migration files are reported above and are **not** tested here."
            echo "- A PR may edit this workflow itself; its own run then satisfies the check."
            echo ""
            echo "> **Do NOT mark this a required check until a run actually reports.** As of"
            echo "> 2026-08-24 every Actions run in this repo ends in \`startup_failure\` (billing),"
            echo "> so requiring it would block every PR instead of gating migrations."
            if [ "$ADDED_COUNT" = "0" ]; then
              echo ""
              echo "> This change adds no migrations, so the populated-schema leg was **not applicable**."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
