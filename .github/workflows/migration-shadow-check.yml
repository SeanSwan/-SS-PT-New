name: Migration Shadow Check

# WHY THIS EXISTS (SWA-200, panel 2026-08-23)
# -------------------------------------------
# Ox Alpha, asked what nobody was proposing: "everyone is guarding the push; nobody is
# guarding the migration." render.yaml builds `main` with `npm run migrate:production`, so a
# push to main runs migrations against the production database, unsupervised.
#
# Every gate built before this one is CLIENT-SIDE — pre-commit and pre-push hooks, living in
# the same clients they police. GLM: "nothing distinguishes 'gate passed' from 'gate not
# installed'." Verified: a fresh clone has core.hooksPath unset and every hook silently skips.
# Kimi, on the local backend audit: "it's a deploy-safety gate wearing a commit-hygiene
# costume. It belongs at the deploy boundary, not the push boundary."
#
# This is that boundary. It runs on GitHub, from the pushed SHA, against a throwaway
# database. It cannot be skipped with --no-verify, cannot be missing because a checkout
# forgot to configure hooks, and — unlike every local gate — it tests THE ARTIFACT THAT
# ACTUALLY DEPLOYS rather than the state of somebody's laptop.
#
# NOT PRODUCTION. The `postgres` service below is an empty ephemeral container that lives and
# dies with the job. No production credential is used, and none should ever be added: the
# whole value is that this is the one place migrations can fail harmlessly.
#
# MERGED SURFACE (2026-08-24, Fable — SWA-200 reconciliation). This file existed twice: this
# branch's rails version (deploy-parity install, SHA-pinned, migrate-twice, entry-point boot
# proof) and an untracked local version carrying a 15-round-panel-reviewed SEEDING layer.
# Neither was a superset. This is the merge: rails as base, the seeder inserted between the
# two migration runs — so the second run now executes against a POPULATED database, which is
# exactly the limitation the original header admitted ("an empty database is not
# production... a NOT NULL added to a populated column, a unique index over existing
# duplicates"). Synthetic deterministic rows, zero PII, no snapshot-handling decision needed.
# Panel items carried: anchored report grep (5), stderr captured without interleaving (10,
# resolved via split streams), selftest as a pre-DB gate (9 — RE-DECIDED to run after
# `npm install`, the deploy-parity install this base uses; the panel ratified "after npm ci"
# against the other copy without knowing install mode was load-bearing).

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/migrations/**'
      - 'backend/models/**'
      - 'backend/scripts/safe-migrate.mjs'
      - 'backend/scripts/pre-migrate-guard.mjs'
      - 'backend/scripts/seed-shadow-db.mjs'
      - 'backend/scripts/seed-shadow-db.selftest.mjs'
      - 'backend/package.json'
      - 'render.yaml'
      - '.github/workflows/migration-shadow-check.yml'
  push:
    branches: [main]
    paths:
      - 'backend/migrations/**'
      - 'backend/models/**'
      - 'backend/scripts/safe-migrate.mjs'
      - 'backend/scripts/seed-shadow-db.mjs'
  workflow_dispatch:

concurrency:
  # One shadow run per ref. A superseded run tells you about a SHA nobody is deploying.
  group: migration-shadow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shadow-migrate:
    runs-on: ubuntu-latest
    name: Migrations run clean on a throwaway database — twice, the second time with data
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shadow
          POSTGRES_PASSWORD: shadow
          POSTGRES_DB: shadow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U shadow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Local container only. Never a production credential — see the header. The password
      # and the URL are the SAME literal on purpose (panel item 4): a mismatch here once let
      # an auth check pass vacuously because the broken URL still parsed.
      DATABASE_URL: postgres://shadow:shadow@localhost:5432/shadow
      NODE_ENV: production

    steps:
      - name: Check out the pushed SHA
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Deliberately `npm install`, not `npm ci` — it is what render.yaml runs. A shadow
      # check that installs differently from the deploy is testing a different artifact.
      # (Interim per SWA-200: the durable fix is moving the DEPLOY to a lockfile-exact
      # install and bringing this gate with it — hermetic on both ends. Separate ticket.)
      - name: Install backend dependencies exactly as the deploy does
        working-directory: backend
        run: npm install --no-audit --no-fund

      # Panel item 9, RE-DECIDED: the seeder's DB-free contract selftest runs before the
      # database is touched. A broken generator contract fails here — cheaply, with full
      # output — instead of surfacing later as a silent empty database.
      - name: Seeder self-test (DB-free core contract)
        working-directory: backend
        run: node scripts/seed-shadow-db.selftest.mjs

      - name: Report the pending migration set before running it
        working-directory: backend
        run: node scripts/pre-migrate-guard.mjs --check

      # THE ACTUAL GATE, leg 1. If migrations cannot apply to an empty database from this
      # SHA, the deploy would carry them to production and fail there instead — mid-build,
      # after the push has already been accepted.
      - name: Run migrations against the shadow database (empty)
        working-directory: backend
        run: npm run migrate:production

      # The seeder's internal gate refuses any URL that is not loopback + "shadow", with no
      # override switch — it structurally cannot point at production. Streams are captured
      # SEPARATELY and concatenated after (panel item 10 as amended): stdout and stderr into
      # one file via `2>&1` can interleave mid-line and break the anchored grep below — the
      # open GLM/Grok finding on the panel's own fix. Split files cannot interleave.
      - name: Seed synthetic rows (shadow-only by internal gate)
        working-directory: backend
        run: |
          set -o pipefail
          node scripts/seed-shadow-db.mjs --rows 5 > seed-shadow.log 2> seed-shadow.err
          status=$?
          cat seed-shadow.err >> seed-shadow.log
          exit $status

      # Panel item 5: anchor to the exact report shape "SHADOW-SEED {" — the bare prefix
      # also matches OK/SKIP/note lines, and the report is the ONLY line with the JSON body.
      - name: Assert seed actually inserted rows (SHADOW-SEED rows > 0)
        working-directory: backend
        shell: bash
        run: |
          if [ ! -f seed-shadow.log ]; then
            echo "FATAL: seed-shadow.log is missing — the seed step did not run"
            exit 1
          fi
          line=$(grep '^SHADOW-SEED {' seed-shadow.log | tail -1)
          if [ -z "$line" ]; then
            echo "FATAL: no SHADOW-SEED report line found — silent no-op seed"
            cat seed-shadow.log
            exit 1
          fi
          echo "$line"
          rows=$(echo "$line" | sed -E 's/^SHADOW-SEED //' | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{console.log(JSON.parse(s).rows||0)})")
          echo "rows inserted: $rows"
          if [ "$rows" -le 0 ]; then
            echo "FATAL: seeder reported zero rows — the second migration run would test nothing"
            exit 1
          fi

      # THE ACTUAL GATE, leg 2 — the reason the seeder exists. Render can rebuild the same
      # SHA (manual redeploy, cache miss, a restart), so migrations must be idempotent; and
      # running them against POPULATED tables is what catches the class an empty database
      # cannot: a NOT NULL added to a filled column, a unique index over existing rows.
      - name: Run migrations AGAIN — idempotent, and now against data
        working-directory: backend
        run: npm run migrate:production

      # The failure this whole layer exists for is a boot crash: ERR_MODULE_NOT_FOUND from an
      # untracked file, or a missing-export SyntaxError from an uncommitted one. Rule 42's
      # local gate infers that from the pusher's working tree. This imports the entry point
      # from the pushed SHA and finds out.
      - name: Prove the backend entry point actually loads from this SHA
        working-directory: backend
        run: |
          ENTRY=$(node -p "require('./package.json').main || 'server.mjs'")
          echo "entry point: $ENTRY"
          node --input-type=module -e "
            const t = setTimeout(() => { console.log('loaded; exiting before the server settles'); process.exit(0); }, 20000);
            try {
              await import('./' + process.env.ENTRY);
              clearTimeout(t);
              console.log('entry point imported without throwing');
              process.exit(0);
            } catch (e) {
              clearTimeout(t);
              console.error('ENTRY POINT FAILED TO LOAD — this SHA would crash-loop on Render:');
              console.error(e && e.stack || e);
              process.exit(1);
            }
          "
        env:
          ENTRY: server.mjs

      - name: Upload seed report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seed-shadow-log
          path: backend/seed-shadow.log
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          echo "### Migration shadow check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Ran the pushed SHA's migrations against a throwaway Postgres — once empty," >> $GITHUB_STEP_SUMMARY
          echo "then seeded deterministic synthetic rows and ran them AGAIN against data" >> $GITHUB_STEP_SUMMARY
          echo "(idempotence + populated-schema classes), then imported the backend entry" >> $GITHUB_STEP_SUMMARY
          echo "point to prove this SHA boots." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This tests the artifact that deploys — not the state of anyone's working" >> $GITHUB_STEP_SUMMARY
          echo "tree — and cannot be skipped with \`--no-verify\` or an unconfigured" >> $GITHUB_STEP_SUMMARY
          echo "\`core.hooksPath\`." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Limit:** synthetic rows are not production data. The stronger version" >> $GITHUB_STEP_SUMMARY
          echo "restores a production snapshot — see SWA-200." >> $GITHUB_STEP_SUMMARY
