name: Documentation Link Check

on:
  push:
    branches:
      - main
    paths:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
    paths:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/docs-check.yml'
      - '.github/markdown-link-check-config.json'
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest
    name: Check Documentation Links

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check links in markdown files
        run: |
          find . -type f -name '*.md' -not -path './node_modules/*' -print0 \
            | xargs -0 -r -n 1 npx --yes markdown-link-check@3.12.2 --config .github/markdown-link-check-config.json --quiet

      - name: Generate report on failure
        if: failure()
        run: |
          echo "## Documentation Link Check Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Some documentation links are broken. Review the job logs and fix the broken links." >> $GITHUB_STEP_SUMMARY

      - name: Success summary
        if: success()
        run: |
          echo "## All Documentation Links Valid" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All markdown links in the repository are working correctly." >> $GITHUB_STEP_SUMMARY
