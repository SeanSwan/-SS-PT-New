name: Body Map Evidence Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/controllers/bodyMapEvidenceController.mjs'
      - 'backend/models/BodyMapEvidence.mjs'
      - 'backend/routes/bodyMapEvidenceRoutes.mjs'
      - 'backend/services/bodyMapEvidenceStorage.mjs'
      - 'backend/services/ai/bodyMapVisionService.mjs'
      - 'frontend/src/components/BodyMap/**'
      - 'frontend/src/context/GlobalClientContext.tsx'
      - 'frontend/src/context/GlobalClientContext.test.ts'
      - 'frontend/src/services/painEntryService.ts'
      - '.github/workflows/bodymap-validation.yml'
  workflow_dispatch:

jobs:
  frontend-bodymap:
    name: Frontend typecheck + Body Map tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npx tsc --noEmit

      - name: Run focused frontend tests
        run: npx vitest run src/context/GlobalClientContext.test.ts src/components/BodyMap/BodyMap.clientTarget.test.ts

  backend-bodymap:
    name: Backend test suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test
