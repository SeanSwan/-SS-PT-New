name: Body Map Evidence Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/controllers/bodyMapEvidenceController.mjs'
      - 'backend/models/BodyMapEvidence.mjs'
      - 'backend/routes/bodyMapEvidenceRoutes.mjs'
      - 'backend/services/bodyMapEvidenceStorage.mjs'
      - 'backend/services/ai/bodyMapVisionService.mjs'
      - 'frontend/src/components/BodyMap/**'
      - 'frontend/src/context/GlobalClientContext.tsx'
      - 'frontend/src/context/GlobalClientContext.test.ts'
      - 'frontend/src/services/painEntryService.ts'
      - '.github/workflows/bodymap-validation.yml'
  workflow_dispatch:

jobs:
  frontend-bodymap:
    name: Frontend typecheck + Body Map tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npx tsc --noEmit

      - name: Run focused frontend tests
        run: npx vitest run src/context/GlobalClientContext.test.ts src/components/BodyMap/BodyMap.clientTarget.test.ts

  backend-bodymap:
    name: Backend test suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      # Bare `npm test` exits 1 on a perfectly good tree because this suite carries a
      # recorded non-green baseline (backend/tests/known-failing-baseline.json). The
      # honest CI question is "did anything NEW fail?" — exactly what the baseline
      # gate answers: exit 1 on any regression OR an incomplete run, and it names
      # baselined files that now pass so the baseline gets pruned, never grown.
      - name: Run backend tests (baseline gate — fails on NEW failures)
        run: node scripts/test-baseline-gate.mjs

      # The Sheen Forge suite is node:test, not vitest — excluded from vitest by
      # config (guarded by tests/unit/nodeTestRunnerSeparation.test.mjs) and run
      # here under its intended runner. All-green as of 2026-09-02.
      - name: Run node:test suite
        run: npm run test:node
