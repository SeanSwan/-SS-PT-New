<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rolodex repair acceptance harness (test-only)</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        padding: 12px;
        background: #030712;
        color: #e0ecf4;
        font-family: 'Sora', system-ui, sans-serif;
      }
      section { margin: 0 0 24px; padding: 12px; border: 1px solid rgba(96, 192, 240, 0.18); border-radius: 12px; }
      h1 { font-size: 1rem; }
      h2 { font-size: 0.85rem; margin: 0 0 8px; }
      /* The harness chrome is test scaffolding, but it must not itself violate
         the 44px target audit it is hosting. */
      button { min-height: 44px; min-width: 44px; }
      #rolodex-repair-root { max-width: 100%; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <!--
      Test-only harness entry. Served by a loopback Vite dev server for the
      Playwright acceptance run. It is NOT a production route and is NOT part of
      the production build entry (only index.html is).
    -->
    <div id="rolodex-repair-root"></div>
    <script type="module" src="/tests/audit/rolodex-repair.harness.tsx"></script>
  </body>
</html>
