<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three.js fleet QA harness</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #030712; color: #e0ecf4; font-family: system-ui, sans-serif; }
  header { padding: 1rem; border-bottom: 1px solid rgba(96,192,240,.25); }
  h1 { margin: 0 0 .25rem; font-size: 1.1rem; }
  p { margin: 0; font-size: .8rem; opacity: .7; }
  #grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 1rem; padding: 1rem; }
  .card { border: 1px solid rgba(96,192,240,.22); border-radius: 12px; overflow: hidden; background: #141419; }
  .meta { padding: .5rem .75rem; }
  .meta h2 { margin: 0; font-size: .82rem; }
  .meta code { font-size: .68rem; color: #50a0f0; }
  .frame { position: relative; aspect-ratio: 16/10; background: linear-gradient(160deg,#002060,#0a0a0f); }
  .frame > * { position: absolute; inset: 0; overflow: hidden; }
</style>
</head>
<body>
<header>
  <h1>Three.js front-page fleet — QA harness</h1>
  <p>Dev-only. Renders all 20 variants for measurement. Not part of the product bundle.</p>
</header>
<div id="grid"></div>
<script type="module" src="/qa-worlds.tsx"></script>
</body>
</html>
