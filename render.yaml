# SwanStudios Render Deployment Configuration
# ==========================================
# Complete configuration for deploying SwanStudios to Render with PostgreSQL

# Main web service (Node.js backend + frontend)
services:
  - type: web
    name: swanstudios-main
    runtime: node
    repo: https://github.com/SeanSwan/-SS-PT-New
    branch: main
    rootDir: ./
    buildCommand: |
      # Phase 3 PLAUD audio pipeline: ffmpeg + ffprobe binaries are
      # bundled via the ffmpeg-static + ffprobe-static npm packages
      # (see backend/package.json + backend/scripts/render-start.mjs).
      # Render's build sandbox is read-only so apt-get install fails —
      # the npm-bundled binaries sidestep that constraint.
      # Install backend dependencies and run migrations
      cd backend && npm install && npm run migrate:production
      # Install frontend dependencies and build
      cd ../frontend && npm install && npm run build
    startCommand: cd backend && npm start
    plan: starter # or standard/pro based on needs
    env:
      - key: TRAINING_PLAN_PDF_DERIVATIVES
        value: true
      - key: TRAINING_PLAN_SCHEDULE_PROJECTIONS
        value: true
      - key: VITE_CLIENT_TODAY_TRAINING_MODULE
        value: true
      - key: VITE_TRAINING_PLAN_SCHEDULE_PROJECTIONS
        value: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://swanstudios-frontend.onrender.com
      - key: FRONTEND_ORIGINS
        value: https://swanstudios-frontend.onrender.com,https://sswanstudios.com,https://www.sswanstudios.com
      - key: DATABASE_URL
        fromDatabase:
          name: swanstudios-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
        length: 32
      - key: STRIPE_SECRET_KEY
        sync: false  # Set manually in Render dashboard
      - key: STRIPE_WEBHOOK_SECRET
        sync: false  # Set manually in Render dashboard; required for Stripe webhook fulfillment
      - key: VITE_STRIPE_PUBLISHABLE_KEY
        sync: false  # Set manually in Render dashboard; canonical Vite/Stripe publishable key
      - key: ENCRYPTION_MASTER_KEY
        sync: false  # Set manually in Render dashboard; 64-character hex key for at-rest encryption
      - key: REDIS_URL
        fromService:
          type: redis
          name: swanstudios-redis
          property: connectionString
      - key: USE_REDIS_SESSIONS
        value: true
      - key: SESSION_SECRET
        generateValue: true
        length: 32

  # Frontend static site (PRODUCTION CONFIGURATION)
  - type: static
    name: swanstudios-frontend
    runtime: node
    repo: https://github.com/SeanSwan/-SS-PT-New
    branch: main
    rootDir: ./frontend
    buildCommand: rm -rf node_modules/.vite && npm install && npm run build
    staticPublishPath: ./dist
    # Security headers for the public static site (2026-07-28 launch hardening).
    #
    # ⚠ SWA-104 (2026-07-30) — READ THIS BEFORE TRUSTING ANYTHING BELOW.
    # This service is NOT Blueprint-synced, so EVERY header in this block is
    # currently INERT. A live probe of https://sswanstudios.com/ returned no CSP,
    # no X-Frame-Options, no Referrer-Policy and no HSTS — only Render's default
    # x-content-type-options. Cloudflare is not the culprit: /api/health on the
    # same host and edge returns the full helmet policy, so headers pass through
    # fine; the static site simply never sent any. The same root cause is already
    # noted for the Cache-Control rule below (SWA-93).
    #
    # Because of that, the CSP is now ALSO shipped inside the build artifact as a
    # <meta http-equiv> tag — see frontend/src/config/contentSecurityPolicy.ts and
    # the build-only plugin in frontend/vite.config.ts. That path reaches visitors
    # without any dashboard action. The header value below is kept in sync with it
    # and adds frame-ancestors, which browsers ignore in a meta tag.
    #
    # STILL REQUIRES SEAN IN THE RENDER DASHBOARD (no code path can deliver these):
    #   X-Frame-Options / frame-ancestors (clickjacking), Strict-Transport-Security,
    #   Permissions-Policy — plus replacing the blunt no-store Cache-Control rule.
    #
    # NOTE: microphone/camera must stay (self) — Coach voice capture and the
    # food scanner run on this origin; an empty allowlist breaks them.
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(self), microphone=(self), geolocation=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      # Cache-delivery correctness (2026-07-29 audit): /v3/* bundles carry
      # content hashes in their filenames — immutable by construction. Live
      # probe showed EVERYTHING served no-store (hashed chunks re-downloaded
      # every visit, zero CDN caching). The blunt no-store rule lives in the
      # dashboard and must be replaced there too (SWA-93) until Blueprint
      # sync is enabled; HTML/manifest/spa-sw.js correctly stay no-cache.
      - path: /v3/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Kept byte-identical to PRODUCTION_CSP_HEADER in
      # frontend/src/config/contentSecurityPolicy.ts (a unit test asserts the
      # value below matches, so the two cannot drift silently).
      #
      # The previous value here was a REPORT-ONLY policy with a tight host
      # allowlist. Enforcing it as written would have broken production: it had
      # no https://cdn.jsdelivr.net (MediaPipe wasm + the admin world-atlas
      # fetch), no https://unpkg.com (ffmpeg core, content-studio compression)
      # and no 'wasm-unsafe-eval' at all. That is precisely why the fetch
      # directives start permissive — a wrong allowlist breaks a revenue path
      # silently, and 'unsafe-inline' is unavoidable while index.html uses an
      # inline onload for the async font swap, which blunts what a host
      # allowlist could buy anyway. Tightening is a separate slice and needs
      # report-uri telemetry from real traffic, not a guess made from grep.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob: https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; media-src 'self' data: blob: https:; connect-src 'self' blob: data: https: wss:; frame-src 'self' https:; worker-src 'self' blob: https:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests; frame-ancestors 'self'"
    routes:
      # SPA routing - serve index.html for all non-file routes
      - type: rewrite
        source: /*
        destination: /index.html
    env:
      # Canonical production API host. The apex routes /api to the backend,
      # but /socket.io is served by the static site, so Socket.IO needs the
      # backend Render origin until the edge route proxies /socket.io too.
      - key: VITE_API_URL
        value: https://sswanstudios.com
      - key: VITE_API_BASE_URL
        value: https://sswanstudios.com
      - key: VITE_BACKEND_URL
        value: https://sswanstudios.com
      - key: VITE_SOCKET_URL
        value: https://ss-pt-new.onrender.com
      - key: VITE_CLIENT_TODAY_TRAINING_MODULE
        value: true
      - key: VITE_TRAINING_PLAN_SCHEDULE_PROJECTIONS
        value: true
      - key: VITE_STRIPE_PUBLISHABLE_KEY
        sync: false  # Set manually in Render dashboard; exposed to Stripe.js at build time
      - key: NODE_ENV
        value: production

  # MCP Servers — DECOMMISSIONED 2026-02-12
  # External Python MCP servers are no longer deployed.
  # All features migrated to in-app implementations.
  # See docs/ai-workflow/launch-readiness/MCP-DECOMMISSION-PLAN.md

# PostgreSQL database
databases:
  - name: swanstudios-db
    databaseName: swanstudios
    user: swanstudios_user
    plan: starter # or standard/pro based on needs

  # Redis for session storage (multi-instance scaling)
  - name: swanstudios-redis
    plan: starter # or standard/pro based on needs
    maxmemoryPolicy: allkeys-lru # Automatically evict old keys when memory limit reached
    ipAllowList: [] # Empty means allow from all Render services

# Environment variables to set manually in Render dashboard:
# - STRIPE_SECRET_KEY: Your Stripe secret key
# - VITE_STRIPE_PUBLISHABLE_KEY: Your Stripe publishable key for Vite builds and backend readiness checks
# - STRIPE_WEBHOOK_SECRET: Your Stripe webhook signing secret
# - ENCRYPTION_MASTER_KEY: 64-character hex key for at-rest encryption
# - EMAIL_SERVICE_API_KEY: If using email service
# - Any other third-party API keys

# Custom domains (optional)
# domains:
#   - name: app.swanstudios.com
#     type: apex
#   - name: api.swanstudios.com
#     type: subdomain
