# SwanStudios Render Deployment Configuration
# ==========================================
#
# ┌──────────────────────────────────────────────────────────────────────────┐
# │ ⛔ DO NOT ENABLE BLUEPRINT SYNC FOR THIS FILE YET — SWA-93 pre-sync audit │
# │    2026-07-30. Syncing as written would NOT adopt the running services.  │
# └──────────────────────────────────────────────────────────────────────────┘
#
# This file is currently INERT: no Render service is managed by it. Two separate
# sessions (2026-07-28, 2026-07-30) wrote config here believing it would ship.
# It reads as authoritative and is not. Verify against the live dashboard before
# trusting any value below.
#
# Render matches Blueprint entries to existing resources BY NAME:
#   "If you add the name of an existing service to your Blueprint file, Render
#    attempts to apply the Blueprint's configuration to that existing service."
# and for names that match nothing, "Render appends a suffix to the name of each
# new resource to prevent collisions" — i.e. it CREATES rather than adopts.
#
# BLOCKER 1 — the service names below match NO live service. Probed 2026-07-30:
#   ss-pt-new.onrender.com            -> HTTP 200, the real backend
#   swanstudios-main.onrender.com     -> HTTP 404, `x-render-routing: no-server`
#   swanstudios-frontend.onrender.com -> HTTP 404, `x-render-routing: no-server`
#   `no-server` is Render's signal that no service is bound to that hostname.
#   Syncing today would spin up NEW duplicate services and leave the real ones
#   unmanaged. The real static-site name is not knowable from outside the
#   dashboard — Sean must read both real names off Render and set them here.
#
# BLOCKER 2 — `plan:` is applied to the matched service. CLAUDE.md rule 11 says
#   Render is a PAID plan (~$60/mo), so the `plan: starter` values that were here
#   could DOWNGRADE production. Both are commented out below until confirmed.
#
# BLOCKER 3 — the `databases:` block is commented out at the bottom. If its names
#   did not match the live Postgres/Redis, a sync could provision EMPTY instances
#   and repoint DATABASE_URL at them. That is the worst outcome available here.
#
# NOT A RISK (checked against Render's docs 2026-07-30, not assumed):
#   * Env vars set in the dashboard but absent here are PRESERVED — "The resource
#     retains any existing environment variable values that aren't overwritten by
#     the Blueprint." The backend reads 256 distinct env vars; only 17 are declared
#     here, including 60 undeclared secret-shaped ones. They survive a sync.
#   * `generateValue: true` sets a value only "if the environment variable doesn't
#     already exist" — it does NOT rotate JWT_SECRET / SESSION_SECRET on sync.
#
# SAFE ENABLE ORDER: fix the two names -> confirm both plans -> restore/verify the
# databases block against the real resources -> sync ONE service first (the static
# site, which is stateless) -> verify headers land -> only then the web service.

# Main web service (Node.js backend + frontend)
services:
  - type: web
    # ⛔ BLOCKER 1: no service by this name exists. The live backend answers on
    # ss-pt-new.onrender.com — set the REAL name here before any sync.
    name: swanstudios-main
    runtime: node
    repo: https://github.com/SeanSwan/-SS-PT-New
    branch: main
    rootDir: ./
    buildCommand: |
      # Phase 3 PLAUD audio pipeline: ffmpeg + ffprobe binaries are
      # bundled via the ffmpeg-static + ffprobe-static npm packages
      # (see backend/package.json + backend/scripts/render-start.mjs).
      # Render's build sandbox is read-only so apt-get install fails —
      # the npm-bundled binaries sidestep that constraint.
      # Install backend dependencies and run migrations
      cd backend && npm install && npm run migrate:production
      # Install frontend dependencies and build
      cd ../frontend && npm install && npm run build
    startCommand: cd backend && npm start
    # ⛔ BLOCKER 2 — commented out 2026-07-30 (SWA-93). `plan` is applied to the
    # matched service, and CLAUDE.md rule 11 records Render as a PAID plan
    # (~$60/mo). Syncing `starter` here could downgrade production. Restore this
    # line only with the value read off the live dashboard.
    # plan: starter
    env:
      - key: TRAINING_PLAN_PDF_DERIVATIVES
        value: true
      - key: TRAINING_PLAN_SCHEDULE_PROJECTIONS
        value: true
      - key: VITE_CLIENT_TODAY_TRAINING_MODULE
        value: true
      - key: VITE_TRAINING_PLAN_SCHEDULE_PROJECTIONS
        value: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://swanstudios-frontend.onrender.com
      - key: FRONTEND_ORIGINS
        value: https://swanstudios-frontend.onrender.com,https://sswanstudios.com,https://www.sswanstudios.com
      - key: DATABASE_URL
        fromDatabase:
          name: swanstudios-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
        length: 32
      - key: STRIPE_SECRET_KEY
        sync: false  # Set manually in Render dashboard
      - key: STRIPE_WEBHOOK_SECRET
        sync: false  # Set manually in Render dashboard; required for Stripe webhook fulfillment
      - key: VITE_STRIPE_PUBLISHABLE_KEY
        sync: false  # Set manually in Render dashboard; canonical Vite/Stripe publishable key
      - key: ENCRYPTION_MASTER_KEY
        sync: false  # Set manually in Render dashboard; 64-character hex key for at-rest encryption
      - key: REDIS_URL
        fromService:
          type: redis
          name: swanstudios-redis
          property: connectionString
      - key: USE_REDIS_SESSIONS
        value: true
      - key: SESSION_SECRET
        generateValue: true
        length: 32

  # Frontend static site (PRODUCTION CONFIGURATION)
  - type: static
    # ⛔ BLOCKER 1: no service by this name exists (probed 2026-07-30 ->
    # `x-render-routing: no-server`). The apex sswanstudios.com is served by a
    # static site whose real name is only visible in the dashboard. Set it here
    # before any sync, or Render will create a duplicate.
    name: swanstudios-frontend
    runtime: node
    repo: https://github.com/SeanSwan/-SS-PT-New
    branch: main
    rootDir: ./frontend
    buildCommand: rm -rf node_modules/.vite && npm install && npm run build
    staticPublishPath: ./dist
    # Security headers for the public static site (2026-07-28 launch hardening).
    #
    # ⚠ SWA-104 (2026-07-30) — READ THIS BEFORE TRUSTING ANYTHING BELOW.
    # This service is NOT Blueprint-synced, so EVERY header in this block is
    # currently INERT. A live probe of https://sswanstudios.com/ returned no CSP,
    # no X-Frame-Options, no Referrer-Policy and no HSTS — only Render's default
    # x-content-type-options. Cloudflare is not the culprit: /api/health on the
    # same host and edge returns the full helmet policy, so headers pass through
    # fine; the static site simply never sent any. The same root cause is already
    # noted for the Cache-Control rule below (SWA-93).
    #
    # Because of that, the CSP is now ALSO shipped inside the build artifact as a
    # <meta http-equiv> tag — see frontend/src/config/contentSecurityPolicy.ts and
    # the build-only plugin in frontend/vite.config.ts. That path reaches visitors
    # without any dashboard action. The header value below is kept in sync with it
    # and adds frame-ancestors, which browsers ignore in a meta tag.
    #
    # STILL REQUIRES SEAN IN THE RENDER DASHBOARD (no code path can deliver these):
    #   X-Frame-Options / frame-ancestors (clickjacking), Strict-Transport-Security,
    #   Permissions-Policy — plus replacing the blunt no-store Cache-Control rule.
    #
    # NOTE: microphone/camera must stay (self) — Coach voice capture and the
    # food scanner run on this origin; an empty allowlist breaks them.
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(self), microphone=(self), geolocation=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      # Cache-delivery correctness (2026-07-29 audit): /v3/* bundles carry
      # content hashes in their filenames — immutable by construction. Live
      # probe showed EVERYTHING served no-store (hashed chunks re-downloaded
      # every visit, zero CDN caching). The blunt no-store rule lives in the
      # dashboard and must be replaced there too (SWA-93) until Blueprint
      # sync is enabled; HTML/manifest/spa-sw.js correctly stay no-cache.
      - path: /v3/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Kept byte-identical to PRODUCTION_CSP_HEADER in
      # frontend/src/config/contentSecurityPolicy.ts (a unit test asserts the
      # value below matches, so the two cannot drift silently).
      #
      # The previous value here was a REPORT-ONLY policy with a tight host
      # allowlist. Enforcing it as written would have broken production: it had
      # no https://cdn.jsdelivr.net (MediaPipe wasm + the admin world-atlas
      # fetch), no https://unpkg.com (ffmpeg core, content-studio compression)
      # and no 'wasm-unsafe-eval' at all. That is precisely why the fetch
      # directives start permissive — a wrong allowlist breaks a revenue path
      # silently, and 'unsafe-inline' is unavoidable while index.html uses an
      # inline onload for the async font swap, which blunts what a host
      # allowlist could buy anyway. Tightening is a separate slice and needs
      # report-uri telemetry from real traffic, not a guess made from grep.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob: https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; media-src 'self' data: blob: https:; connect-src 'self' blob: data: https: wss:; frame-src 'self' https:; worker-src 'self' blob: https:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests; frame-ancestors 'self'"
    routes:
      # SPA routing - serve index.html for all non-file routes
      - type: rewrite
        source: /*
        destination: /index.html
    env:
      # Canonical production API host. The apex routes /api to the backend,
      # but /socket.io is served by the static site, so Socket.IO needs the
      # backend Render origin until the edge route proxies /socket.io too.
      - key: VITE_API_URL
        value: https://sswanstudios.com
      - key: VITE_API_BASE_URL
        value: https://sswanstudios.com
      - key: VITE_BACKEND_URL
        value: https://sswanstudios.com
      - key: VITE_SOCKET_URL
        value: https://ss-pt-new.onrender.com
      - key: VITE_CLIENT_TODAY_TRAINING_MODULE
        value: true
      - key: VITE_TRAINING_PLAN_SCHEDULE_PROJECTIONS
        value: true
      - key: VITE_STRIPE_PUBLISHABLE_KEY
        sync: false  # Set manually in Render dashboard; exposed to Stripe.js at build time
      - key: NODE_ENV
        value: production

  # MCP Servers — DECOMMISSIONED 2026-02-12
  # External Python MCP servers are no longer deployed.
  # All features migrated to in-app implementations.
  # See docs/ai-workflow/launch-readiness/MCP-DECOMMISSION-PLAN.md

# ⛔ BLOCKER 3 — datastore declarations, COMMENTED OUT 2026-07-30 (SWA-93).
#
# WHY: this is the worst failure mode available in this file. Render matches
# Blueprint resources by name; if these names do not match the live Postgres and
# Redis, applying the Blueprint would PROVISION NEW EMPTY INSTANCES and repoint
# DATABASE_URL / REDIS_URL (declared above via fromDatabase / fromService) at
# them. The app would boot healthy against an empty database. Nothing in the file
# as written could be verified from outside the dashboard — the two *services*
# named here were both proven not to exist, so these names cannot be assumed good
# either. `plan: starter` also is not among the Postgres plan values Render
# currently documents, which suggests this block was never applied to anything.
#
# SIDE EFFECT, AND IT IS THE GOOD KIND: with this block commented out, the
# `fromDatabase: swanstudios-db` and `fromService: swanstudios-redis` references
# in the web service above are now DANGLING. An accidental sync should therefore
# fail loudly on an unresolvable reference rather than quietly provisioning an
# empty datastore and repointing the app at it. Fail-closed beats fail-silent.
#
# BEFORE RESTORING: read the real Postgres and Redis names + plans off the Render
# dashboard, confirm they match character-for-character, and restore this block in
# its own commit so the diff is reviewable on its own.
#
